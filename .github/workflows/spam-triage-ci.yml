name: spam-triage CI

on:
  push:
    paths:
      - "spam-triage/**"
      - ".github/workflows/spam-triage-ci.yml"
  pull_request:
    paths:
      - "spam-triage/**"
      - ".github/workflows/spam-triage-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: spam-triage

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spam-triage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_HIDDEN_ADMIN_PATH: /ci-admin
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build

      - name: Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
